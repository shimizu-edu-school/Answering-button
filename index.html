<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カラー早押し</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
  :root {
    --bg: #FBF7EF;
    --surface: #FFFFFF;
    --surface-2: #F3EDE0;
    --text: #2A2420;
    --muted: #8B8072;
    --line: #E6DFD1;
    --accent: #6E4FA6;
    --accent-ink: #FFFFFF;
    --accent-soft: #EDE6F7;
    --good: #3FA65C;
    --bad: #C0392B;
    --warn: #C8781E;

    --c-red: #E0453C;
    --c-blue: #3468E0;
    --c-yellow: #D99A1E;
    --c-green: #2F9E58;
    --c-red-ink: #FFFFFF;
    --c-blue-ink: #FFFFFF;
    --c-yellow-ink: #241B04;
    --c-green-ink: #FFFFFF;

    --shadow: 0 1px 2px rgba(40,30,10,.06), 0 8px 24px -12px rgba(40,30,10,.18);
    --radius: 18px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17130E;
      --surface: #241E17;
      --surface-2: #2C2419;
      --text: #F4EEE2;
      --muted: #AFA48F;
      --line: #3B3226;
      --accent: #C3A9F0;
      --accent-ink: #23163B;
      --accent-soft: #33274C;
      --good: #5FCB80;
      --bad: #FF9B8F;
      --warn: #EFA85B;

      --c-red: #FF6E64;
      --c-blue: #6E97FF;
      --c-yellow: #F6C25E;
      --c-green: #62D486;
      --c-red-ink: #34110E;
      --c-blue-ink: #0D1B3B;
      --c-yellow-ink: #2B1D02;
      --c-green-ink: #06280F;

      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px -12px rgba(0,0,0,.55);
    }
  }

  :root[data-theme="dark"] {
    --bg: #17130E;
    --surface: #241E17;
    --surface-2: #2C2419;
    --text: #F4EEE2;
    --muted: #AFA48F;
    --line: #3B3226;
    --accent: #C3A9F0;
    --accent-ink: #23163B;
    --accent-soft: #33274C;
    --good: #5FCB80;
    --bad: #FF9B8F;
    --warn: #EFA85B;

    --c-red: #FF6E64;
    --c-blue: #6E97FF;
    --c-yellow: #F6C25E;
    --c-green: #62D486;
    --c-red-ink: #34110E;
    --c-blue-ink: #0D1B3B;
    --c-yellow-ink: #2B1D02;
    --c-green-ink: #06280F;

    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px -12px rgba(0,0,0,.55);
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .display {
    font-family: "Zen Maru Gothic", "Zen Kaku Gothic New", sans-serif;
    text-wrap: balance;
    margin: 0;
  }
  .tabular { font-variant-numeric: tabular-nums; }
  button { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  #app { min-height: 100vh; display: flex; flex-direction: column; }

  /* ---------- shared bits ---------- */
  .btn {
    appearance: none;
    border: none;
    border-radius: 14px;
    padding: 14px 22px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn:hover { filter: brightness(1.06); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
  .btn-lg { padding: 18px 28px; font-size: 1.15rem; border-radius: 16px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; filter: none; transform: none; }
  .btn-primary:disabled { background: var(--surface-2); color: var(--muted); opacity: 1; }

  input.field, input.field-sm {
    font-family: inherit;
    font-size: 1.4rem;
    text-align: center;
    letter-spacing: .12em;
    padding: 14px 12px;
    border-radius: 14px;
    border: 2px solid var(--line);
    background: var(--surface);
    color: var(--text);
    width: 100%;
  }
  input.field-sm { font-size: 1rem; letter-spacing: normal; padding: 11px 12px; }
  input.field:focus, input.field-sm:focus { border-color: var(--accent); }
  label.field-label {
    display: block;
    font-size: .78rem;
    font-weight: 700;
    letter-spacing: .08em;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--muted);
    font-size: .82rem;
    font-weight: 700;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pill.live { color: var(--good); }
  .pill.live .dot { animation: pulse 1.6s ease-in-out infinite; }
  .pill.score { color: var(--accent); background: var(--accent-soft); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .pill.live .dot { animation: none; } }

  /* ---------- role select ---------- */
  .role-screen { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
  .role-card {
    width: 100%; max-width: 420px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 24px; box-shadow: var(--shadow); padding: 36px 30px; text-align: center;
  }
  .role-card .eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
  .role-card h1 { font-size: 1.9rem; font-weight: 900; margin: 6px 0 4px; }
  .role-card p.sub { color: var(--muted); margin: 0 0 28px; font-size: .95rem; }
  .role-swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 26px; }
  .role-swatches span { display: block; height: 10px; border-radius: 6px; }
  .role-buttons { display: grid; gap: 12px; }
  .role-buttons .btn { width: 100%; }

  /* ---------- generic card screen ---------- */
  .screen { flex: 1; display: flex; flex-direction: column; }
  .card-screen { align-items: center; justify-content: center; padding: 28px 20px; }
  .basic-card {
    width: 100%; max-width: 380px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 24px; box-shadow: var(--shadow); padding: 32px 28px;
  }
  .basic-card h2 { font-size: 1.35rem; margin-bottom: 4px; }
  .basic-card p.sub { color: var(--muted); font-size: .9rem; margin: 0 0 22px; }
  .field-stack { display: grid; gap: 16px; }
  .back-link {
    background: none; border: none; color: var(--muted); font-weight: 700;
    font-size: .85rem; cursor: pointer; padding: 4px 0; text-align: left;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .back-link:hover { color: var(--text); }
  .divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .78rem; margin: 6px 0; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .error-note { color: var(--bad); font-size: .85rem; font-weight: 700; min-height: 1.2em; }

  /* ---------- teacher: question prep ---------- */
  .prep-screen { align-items: center; justify-content: center; padding: 32px 20px; }
  .prep-card {
    width: 100%; max-width: 660px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 24px; box-shadow: var(--shadow); padding: 32px 30px;
  }
  .prep-card h2 { font-size: 1.4rem; margin-bottom: 4px; }
  .prep-card p.sub { color: var(--muted); font-size: .9rem; margin: 0 0 20px; }

  .class-select-section { margin-bottom: 22px; }
  .class-pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .class-pill {
    appearance: none; border: 2px solid var(--line); background: var(--surface); color: var(--text);
    font-family: inherit; font-weight: 700; font-size: .88rem; padding: 8px 16px; border-radius: 999px; cursor: pointer;
    transition: border-color .12s ease, background .12s ease, color .12s ease;
  }
  .class-pill:hover { border-color: var(--accent); }
  .class-pill.is-selected { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .class-other-wrap { margin-top: 10px; max-width: 280px; }

  .file-import {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    background: var(--surface-2); border: 1.5px dashed var(--line); border-radius: 14px; padding: 14px 16px;
    margin-bottom: 20px;
  }
  .file-import .fi-text { font-size: .85rem; color: var(--muted); }
  .file-import .fi-text strong { color: var(--text); display: block; font-size: .92rem; margin-bottom: 2px; }
  .file-import input[type="file"] { max-width: 220px; font-size: .8rem; color: var(--muted); }

  .q-list { display: grid; gap: 10px; margin-bottom: 4px; }
  .q-item { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .q-item .q-main { flex: 1; min-width: 0; }
  .q-unit-tag {
    display: inline-block; font-size: .72rem; font-weight: 800; color: var(--accent);
    background: var(--accent-soft); padding: 2px 9px; border-radius: 999px; margin-right: 8px; vertical-align: middle;
  }
  .q-item .q-num { font-weight: 800; color: var(--accent); font-family: "Zen Maru Gothic", sans-serif; margin-right: 6px; }
  .q-item .q-text { font-weight: 700; word-break: break-word; }
  .q-item .q-choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .q-chip { font-size: .74rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; position: relative; }
  .q-chip.is-correct { box-shadow: 0 0 0 2px var(--text); }
  .q-chip.is-correct::after { content: "✓"; margin-left: 4px; }
  .q-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.05rem; padding: 2px 6px; line-height: 1; flex-shrink: 0; }
  .q-del:hover { color: var(--bad); }
  .q-empty-note { color: var(--muted); font-size: .88rem; text-align: center; padding: 18px 0; }

  .q-form { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 14px; display: grid; gap: 12px; }
  .q-form .form-title { font-size: .82rem; font-weight: 800; color: var(--muted); letter-spacing: .04em; }
  textarea.field-text {
    font-family: inherit; font-size: 1rem; padding: 12px 14px; border-radius: 12px;
    border: 2px solid var(--line); background: var(--surface); color: var(--text);
    resize: vertical; min-height: 52px; text-align: left; letter-spacing: normal; width: 100%;
  }
  textarea.field-text:focus { border-color: var(--accent); }
  .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice-field {
    display: flex; align-items: center; gap: 8px; border: 2px solid var(--line);
    border-radius: 12px; padding: 9px 12px; background: var(--surface); cursor: pointer;
    transition: border-color .12s ease;
  }
  .choice-field.is-correct { border-color: var(--good); }
  .choice-field .swatch { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; }
  .choice-field input[type="text"] { border: none; background: transparent; font-family: inherit; font-size: .92rem; width: 100%; color: var(--text); }
  .choice-field input[type="text"]:focus { outline: none; }
  .choice-field .correct-toggle {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line);
    background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: .8rem; color: transparent;
  }
  .choice-field.is-correct .correct-toggle { background: var(--good); border-color: var(--good); color: #fff; }
  .correct-hint { font-size: .78rem; color: var(--muted); }
  .prep-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px; flex-wrap: wrap; }

  /* ---------- question banner ---------- */
  .question-banner { background: var(--accent-soft); border-radius: 16px; padding: 22px 28px; text-align: left; }
  .question-banner .q-eyebrow { font-size: clamp(.85rem, .5vw + .7rem, 1.05rem); font-weight: 800; letter-spacing: .08em; color: var(--accent); text-transform: uppercase; }
  .question-banner .q-text { font-size: clamp(1.7rem, 1.8vw + 1.2rem, 2.6rem); font-weight: 700; margin-top: 8px; font-family: "Zen Maru Gothic", sans-serif; text-wrap: balance; line-height: 1.4; }

  /* ---------- teacher: lobby ---------- */
  .lobby-screen { align-items: center; justify-content: center; padding: 28px 20px; }
  .lobby-card {
    width: 100%; max-width: 760px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 24px; box-shadow: var(--shadow); padding: 30px 30px 26px;
  }
  .lobby-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .lobby-head h2 { font-size: 1.3rem; }
  .lobby-head .code-value { font-size: 2rem; }
  .lobby-grid { display: grid; grid-template-columns: 220px 1fr; gap: 26px; align-items: start; }
  .qr-frame { background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); }
  .qr-frame img, .qr-frame canvas { display: block; width: 100%; height: auto; }
  .qr-caption { text-align: center; font-size: .78rem; color: var(--muted); margin-top: 8px; }
  .lobby-players h3 { font-size: .95rem; margin-bottom: 10px; }
  .lobby-footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 24px; flex-wrap: wrap; }
  @media (max-width: 560px) { .lobby-grid { grid-template-columns: 1fr; } .qr-frame { max-width: 220px; margin: 0 auto; } }

  /* ---------- teacher: dashboard ---------- */
  .dash-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; padding: 20px 24px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .code-block { display: flex; align-items: baseline; gap: 12px; }
  .code-label { font-size: .72rem; font-weight: 700; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
  .code-value { font-size: 2.4rem; font-weight: 900; letter-spacing: .12em; color: var(--accent); font-family: "Zen Maru Gothic", sans-serif; }
  .dash-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  .dash-body { flex: 1; padding: 26px 24px 40px; display: flex; flex-direction: column; gap: 24px; max-width: 1400px; margin: 0 auto; width: 100%; }
  .status-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .round-title { font-size: 1.1rem; font-weight: 700; }
  .progress-note { color: var(--muted); font-size: .9rem; }

  .chart-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; align-items: end; }
  .chart-col {
    background: var(--surface); border-radius: var(--radius); padding: 18px 16px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    box-shadow: var(--shadow); border: 3px solid var(--line); position: relative;
    transition: opacity .2s ease;
  }
  .chart-count { font-family: "Zen Maru Gothic", sans-serif; font-weight: 900; font-size: clamp(2.2rem, 1.6vw + 1.6rem, 3.2rem); line-height: 1; }
  .chart-track { width: 100%; height: 160px; background: var(--surface-2); border-radius: 12px; display: flex; align-items: flex-end; overflow: hidden; position: relative; }
  .chart-bar { width: 100%; border-radius: 10px 10px 0 0; transition: height .35s cubic-bezier(.2,.8,.2,1); height: 0%; }
  .chart-name { font-weight: 700; font-size: clamp(1.15rem, 1vw + .75rem, 1.7rem); text-align: center; line-height: 1.3; }
  .chart-name .jp { color: var(--muted); font-weight: 500; font-size: clamp(.78rem, .4vw + .6rem, .95rem); display: block; margin-top: 2px; }
  .chart-col.is-correct { box-shadow: var(--shadow), 0 0 0 3px var(--good); }
  .chart-col.is-wrong { opacity: .5; }
  .chart-badge {
    position: absolute; top: -12px; right: -10px; width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.1rem;
    box-shadow: var(--shadow); color: #fff;
  }
  .chart-badge.ok { background: var(--good); }
  .chart-badge.no { background: var(--bad); }

  .players-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
  .players-panel h3 { font-size: .95rem; margin-bottom: 12px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 6px 12px; border-radius: 999px; background: var(--surface-2); font-size: .85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .chip .mark { width: 9px; height: 9px; border-radius: 50%; }
  .chip.answered { background: var(--accent-soft); }
  .empty-note { color: var(--muted); font-size: .88rem; }

  /* ---------- leaderboard ---------- */
  .leaderboard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px 24px; }
  .leaderboard h2 { font-size: 1.3rem; margin-bottom: 18px; }
  .lb-row { display: flex; align-items: center; gap: 14px; padding: 10px 6px; border-bottom: 1px solid var(--line); }
  .lb-row:last-child { border-bottom: none; }
  .lb-rank { font-family: "Zen Maru Gothic", sans-serif; font-weight: 900; font-size: 1.1rem; width: 30px; color: var(--muted); text-align: center; }
  .lb-row:nth-child(1) .lb-rank { color: #D4A017; }
  .lb-row:nth-child(2) .lb-rank { color: #9AA0A6; }
  .lb-row:nth-child(3) .lb-rank { color: #C08A5A; }
  .lb-name { flex: 1; font-weight: 700; }
  .lb-score { font-family: "Zen Maru Gothic", sans-serif; font-weight: 900; color: var(--accent); }
  .lb-back { margin-top: 16px; }

  .class-summary { margin-bottom: 20px; }
  .summary-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 6px; }
  .summary-tile { background: var(--accent-soft); border-radius: 16px; padding: 20px 18px; text-align: center; }
  .summary-tile-value { font-family: "Zen Maru Gothic", sans-serif; font-weight: 900; font-size: 2.4rem; color: var(--accent); line-height: 1; }
  .summary-tile-label { font-size: .82rem; color: var(--muted); font-weight: 700; margin-top: 8px; }
  .class-summary .unit-row-sub { text-align: center; margin-top: 14px; }
  @media (max-width: 480px) { .summary-tiles { grid-template-columns: 1fr; } }

  .unit-panel { margin-bottom: 20px; }
  .unit-row { padding: 12px 6px; border-bottom: 1px solid var(--line); }
  .unit-row:last-child { border-bottom: none; }
  .unit-row-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .unit-row-name { font-weight: 800; font-size: 1rem; }
  .unit-row-rate { font-family: "Zen Maru Gothic", sans-serif; font-weight: 900; font-size: 1.2rem; color: var(--accent); }
  .unit-bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .unit-bar-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s ease; }
  .unit-row-sub { color: var(--muted); font-size: .82rem; margin-top: 6px; }

  .class-compare { margin-bottom: 20px; }
  .compare-row { display: grid; grid-template-columns: 1.4fr .8fr 1fr; align-items: center; gap: 10px; padding: 10px 10px; border-bottom: 1px solid var(--line); border-radius: 10px; }
  .compare-row:last-child { border-bottom: none; }
  .compare-head { color: var(--muted); font-size: .78rem; font-weight: 700; }
  .compare-name { font-weight: 800; font-size: .98rem; }
  .compare-rate { font-family: "Zen Maru Gothic", sans-serif; font-weight: 900; font-size: 1.1rem; color: var(--accent); }
  .compare-count { color: var(--muted); font-size: .88rem; }
  .compare-row.is-self { background: var(--accent-soft); }
  .compare-row.is-self .compare-name::after { content: " ← 今回"; font-size: .74rem; font-weight: 700; color: var(--accent); }
  @media (max-width: 480px) { .compare-row { grid-template-columns: 1.2fr .8fr 1fr; padding: 10px 8px; } }

  /* ---------- student ---------- */
  .join-screen { align-items: center; justify-content: center; padding: 28px 20px; }
  .play-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .play-top .who { font-size: .82rem; color: var(--muted); }
  .play-top .who strong { color: var(--text); }
  .play-top .top-right { display: flex; gap: 8px; align-items: center; }

  .play-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 18px 32px; gap: 22px; text-align: center; }
  .play-status { font-size: 1.05rem; font-weight: 700; color: var(--muted); }
  .play-status.open { color: var(--good); }

  .buzz-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; width: 100%; max-width: 860px; }
  .buzz-btn {
    aspect-ratio: 1 / 0.85; border: none; border-radius: 22px; cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,.18), var(--shadow);
    transition: transform .08s ease, box-shadow .08s ease, filter .1s ease, opacity .15s ease;
    position: relative; display: flex; align-items: center; justify-content: center;
  }
  .buzz-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.18), var(--shadow); }
  .buzz-btn:disabled { cursor: not-allowed; }
  .buzz-btn.dim { opacity: .3; box-shadow: none; }
  .buzz-btn.chosen { outline: 5px solid var(--text); outline-offset: 3px; }
  .buzz-btn .badge {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 2rem; font-weight: 900; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.35);
  }
  @media (max-width: 480px) {
    .buzz-grid { gap: 8px; }
    .buzz-btn { border-radius: 16px; }
    .buzz-btn .badge { font-size: 1.3rem; }
  }

  .b-red { background: var(--c-red); }
  .b-blue { background: var(--c-blue); }
  .b-yellow { background: var(--c-yellow); }
  .b-green { background: var(--c-green); }

  .result-panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
    padding: 24px 28px; box-shadow: var(--shadow); max-width: 360px; text-align: center;
  }
  .result-panel .rp-icon { font-size: 2.4rem; line-height: 1; margin-bottom: 6px; }
  .result-panel .rp-title { font-family: "Zen Maru Gothic", sans-serif; font-weight: 900; font-size: 1.3rem; }
  .result-panel.ok .rp-title { color: var(--good); }
  .result-panel.no .rp-title { color: var(--bad); }
  .result-panel .rp-sub { color: var(--muted); font-size: .88rem; margin-top: 6px; }

  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px;
    font-size: .85rem; font-weight: 700; box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  @media (max-width: 900px) {
    .chart-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 640px) {
    .code-value { font-size: 1.9rem; }
    .dash-body { padding: 20px 16px 32px; }
  }
</style>

      osc.stop(start + 0.24);
    });

  // ---------- BGM (during open question) ----------
  var BGM_TRACKS = ["track1.mp3", "track2.mp3", "track3.mp3", "track4.mp3", "track5.mp3", "track6.mp3", "track7.mp3"];
  var BGM_VOLUME = 0.14;
  function createBgmController() {
    var audioEl = null;
    var currentRound = null;
    function ensureForRound(round) {
      if (currentRound === round && audioEl) return;
      stop();
      try {
        var track = BGM_TRACKS[Math.floor(Math.random() * BGM_TRACKS.length)];
        audioEl = new Audio(track);
        audioEl.loop = true;
        audioEl.volume = BGM_VOLUME;
        audioEl.play().catch(function () {});
        currentRound = round;
      } catch (e) {}
    }
    function stop() {
      if (audioEl) {
        try {
          audioEl.pause();
          audioEl.currentTime = 0;
          audioEl.loop = false;
          audioEl.src = '';
          audioEl.load();
        } catch (e) {}
        audioEl = null;
      }
      currentRound = null;
    }
    return { ensureForRound: ensureForRound, stop: stop };
  }

  // ---------- question text-file parsing ----------
  function parseCsvLine(line) {
    var out = [];
    var cur = "";
    var inQuotes = false;
    for (var i = 0; i < line.length; i++) {
      var ch = line[i];
      if (inQuotes) {
        if (ch === '"') {
          if (line[i + 1] === '"') { cur += '"'; i++; }
          else inQuotes = false;
        } else cur += ch;
      } else {
        if (ch === '"') inQuotes = true;
        else if (ch === ",") { out.push(cur); cur = ""; }
        else cur += ch;
      }
    }
    out.push(cur);
    return out.map(function (s) { return s.trim(); });
  }

  function colorWordToKey(word) {
    if (!word) return null;
    var w = word.trim().toLowerCase();
    var map = {
      "赤": "red", "あか": "red", "red": "red", "r": "red",
      "青": "blue", "あお": "blue", "blue": "blue", "b": "blue",
      "黄": "yellow", "黄色": "yellow", "きいろ": "yellow", "yellow": "yellow", "y": "yellow",
      "緑": "green", "みどり": "green", "green": "green", "g": "green"
    };
    return map[w] || map[word.trim()] || null;
  }

  function parseQuestionsFile(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // strip a UTF-8 BOM (Excel-saved CSV)
    var lines = text.split(/\r\n|\n|\r/).map(function (l) { return l.trim(); }).filter(function (l) { return l.length > 0; });
    var questions = [];
    var skipped = 0;
    lines.forEach(function (line, idx) {
      var cols = line.indexOf("\t") !== -1 ? line.split("\t").map(function (s) { return s.trim(); }) : parseCsvLine(line);
      if (cols.length < 7) { if (idx > 0) skipped++; return; }
      var unit = cols[0], text0 = cols[1], red = cols[2], blue = cols[3], yellow = cols[4], green = cols[5], correctWord = cols[6];
      var correctKey = colorWordToKey(correctWord);
      if (!unit || !text0 || !correctKey) {
        if (idx > 0) skipped++; // first row failing to parse is treated as a header row, not an error
        return;
      }
      questions.push({ unit: unit, text: text0, choices: { red: red, blue: blue, yellow: yellow, green: green }, correct: correctKey });
    });
    return { questions: questions, skipped: skipped };
  }

  function questionLabel(question, colorKey) {
    var jp = colorByKey(colorKey).jp;
    if (question && question.choices && question.choices[colorKey]) return question.choices[colorKey];
    return jp;
  }

  // Deterministic short key identifying a question set, so different classes
  // that were quizzed on the same file can be matched up for comparison.
  function contentKeyFor(questions) {
    var sig = (questions || []).map(function (q) { return (q.unit || "") + "|" + q.text; }).join("~~");
    var h = 0;
    for (var i = 0; i < sig.length; i++) { h = (h * 31 + sig.charCodeAt(i)) | 0; }
    return "k" + (h >>> 0).toString(36);
  }

    otherWrap.appendChild(otherInput);

    CLASS_OPTIONS.forEach(function (label) {
      var btn = el("button", "class-pill", label);
      btn.type = "button";
      btn.addEventListener("click", function () {
        Object.keys(classButtons).forEach(function (k) { classButtons[k].classList.remove("is-selected"); });
        btn.classList.add("is-selected");
        if (label === "その他") {
          otherWrap.style.display = "";
          teacherState.className = otherInput.value.trim() || null;
          otherInput.focus();
        } else {
          otherWrap.style.display = "none";
          teacherState.className = label;
        }
        updateCreateBtnState();
      });
      classRow.appendChild(btn);
      classButtons[label] = btn;
    });
    otherInput.addEventListener("input", function () {
      teacherState.className = otherInput.value.trim() || null;
      updateCreateBtnState();
    });
    classSection.appendChild(classRow);
    classSection.appendChild(otherWrap);
    card.appendChild(classSection);

    // ---- file import ----
    var fileImport = el("div", "file-import");
    var fiText = el("div", "fi-text", '<strong>テキストファイルから読み込む</strong>1行1問、「単元,問題文,赤,青,黄,緑,正解」の順（カンマまたはタブ区切り）。1行目は見出し行として無視されます。テンプレートファイルは別途お渡ししています。');
    var fileInput = el("input");
    fileInput.type = "file";
    fileInput.accept = ".csv,.txt,text/plain,text/csv";
    fileInput.addEventListener("change", function () {
      var f = fileInput.files && fileInput.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        var result = parseQuestionsFile(String(reader.result || ""));
        teacherState.prepQuestions = teacherState.prepQuestions.concat(result.questions);
        renderQList();
        if (result.questions.length) toast(result.questions.length + "問を読み込みました" + (result.skipped ? "（" + result.skipped + "行は形式エラーでスキップ）" : ""));
        else toast("読み込める問題が見つかりませんでした。形式を確認してください。");
        fileInput.value = "";
      };
      reader.readAsText(f, "utf-8");
    });
    fileImport.appendChild(fiText);
    fileImport.appendChild(fileInput);
    card.appendChild(fileImport);

    var qList = el("div", "q-list");
    var emptyNote = el("div", "q-empty-note", "まだ問題がありません。ファイルを読み込むか、下のフォームから追加してください。");
    card.appendChild(qList);
    card.appendChild(emptyNote);

    // ---- manual add form ----
    var form = el("div", "q-form");
    form.appendChild(el("div", "form-title", "問題を追加"));
    var unitInput = el("input", "field-sm");
    unitInput.type = "text";
    unitInput.placeholder = "単元（例：現在完了形）";
    unitInput.maxLength = 30;
    form.appendChild(unitInput);
    var qText = el("textarea", "field-text");
    qText.placeholder = "例）日本でいちばん高い山は？";
    qText.rows = 2;
    form.appendChild(qText);

    var choiceGrid = el("div", "choice-grid");
    var choiceInputs = {};
    var choiceFields = {};
    var correctKey = null;
    COLORS.forEach(function (c) {
      var field = el("div", "choice-field");
      var swatch = el("span", "swatch");
      swatch.style.background = "var(" + c.var + ")";
      var input = el("input");
      input.type = "text";
      input.placeholder = c.jp + "の選択肢（例：富士山）";
      input.maxLength = 40;
      var toggle = el("button", "correct-toggle", "✓");
      toggle.type = "button";
      toggle.title = "この色を正解にする";
      toggle.addEventListener("click", function () {
        correctKey = c.key;
        COLORS.forEach(function (c2) { choiceFields[c2.key].classList.toggle("is-correct", c2.key === correctKey); });
      });
      field.appendChild(swatch);
      field.appendChild(input);
      field.appendChild(toggle);
      choiceGrid.appendChild(field);
      choiceInputs[c.key] = input;
      choiceFields[c.key] = field;
    });
    form.appendChild(choiceGrid);
    form.appendChild(el("div", "correct-hint", "○ボタンを押して正解の色を選んでください（1つ必須）"));

    var addBtn = el("button", "btn btn-ghost", "＋ この問題をリストに追加");
    form.appendChild(addBtn);
    card.appendChild(form);

    addBtn.addEventListener("click", function () {
      var unit = unitInput.value.trim();
      var text = qText.value.trim();
      if (!unit) { toast("単元名を入力してください。"); unitInput.focus(); return; }
      if (!text) { toast("問題文を入力してください。"); qText.focus(); return; }
      if (!correctKey) { toast("正解の色を選んでください。"); return; }
      var choices = {};
      COLORS.forEach(function (c) { choices[c.key] = choiceInputs[c.key].value.trim(); });
      teacherState.prepQuestions.push({ unit: unit, text: text, choices: choices, correct: correctKey });
      qText.value = "";
      COLORS.forEach(function (c) { choiceInputs[c.key].value = ""; choiceFields[c.key].classList.remove("is-correct"); });
      correctKey = null;
      renderQList();
      qText.focus();
    });

    var footer = el("div", "prep-footer");
    var back = el("button", "back-link", "← もどる");
    back.addEventListener("click", renderRoleSelect);
    var createBtn = el("button", "btn btn-primary btn-lg", "② 教室をつくる");
    createBtn.disabled = true;
    createBtn.addEventListener("click", function () {
      createBtn.disabled = true;
      createBtn.textContent = "作成中…";
      createRoom(teacherState.prepQuestions, function (err) {
        if (err) {
          createBtn.disabled = false;
          createBtn.textContent = "② 教室をつくる";
          toast("作成に失敗しました。もう一度お試しください。");
        }
      });
    });
    footer.appendChild(back);
    footer.appendChild(createBtn);
    card.appendChild(footer);

    wrap.appendChild(card);
    render(wrap);

    function updateCreateBtnState() {
      createBtn.disabled = teacherState.prepQuestions.length === 0 || !teacherState.className;
    }

    function renderQList() {
      qList.innerHTML = "";
      var qs = teacherState.prepQuestions;
      emptyNote.style.display = qs.length === 0 ? "" : "none";
      updateCreateBtnState();
      qs.forEach(function (q, idx) {
        var item = el("div", "q-item");
        var main = el("div", "q-main");
        main.appendChild(el("span", "q-unit-tag", q.unit || "単元未設定"));
        main.appendChild(el("span", "q-num", (idx + 1) + "."));
        main.appendChild(el("span", "q-text", q.text));
        var chips = el("div", "q-choices");
        COLORS.forEach(function (c) {
          var chip = el("span", "q-chip" + (q.correct === c.key ? " is-correct" : ""), questionLabel(q, c.key));
          chip.style.background = "var(" + c.var + ")";
          chip.style.color = "var(" + c.var + "-ink)";
          chips.appendChild(chip);
        });
        main.appendChild(chips);
        var del = el("button", "q-del", "✕");
        del.setAttribute("aria-label", "この問題を削除");
        del.addEventListener("click", function () {
          teacherState.prepQuestions.splice(idx, 1);
          renderQList();
        });
        item.appendChild(main);
        item.appendChild(del);
        qList.appendChild(item);
      });
    }
    renderQList();
  }

  // ---- ② 教室をつくる ----
  function createRoom(questions, cb) {
    dbPromise.then(function (db) {
      if (!db) { cb && cb("no-db"); toast("この画面ではリアルタイム機能が使えません。"); return; }
      var code = randomCode();
      db.doc("rooms/" + code).set({
        status: "lobby",
        round: 0,
        questions: questions,
        className: teacherState.className || "未設定",
        createdAt: Date.now(),
        updatedAt: Date.now()
      }).then(function () {
        teacherState.code = code;
        writeLS("cb_last_room", code);
        cb && cb(null);
        renderTeacherLobby();
      }).catch(function () {
        cb && cb("write-failed");
      });
    });
  }

  // ---- 待機室（生徒の入室を確認してからクイズ開始） ----
  function renderTeacherLobby() {
    var code = teacherState.code;
    var wrap = el("div", "screen lobby-screen");
    var card = el("div", "lobby-card");

    var head = el("div", "lobby-head");
    head.innerHTML =
      '<div><span class="pill">' + (teacherState.className || "未設定") + '</span>' +
      '<h2 class="display" style="margin-top:8px;">③ 生徒の入室を待つ</h2>' +
      '<p class="sub" style="margin:6px 0 0;">QRコードを読み取るか、コードを手入力して参加できます。</p></div>' +
      '<div class="code-block"><span class="code-label">ルームコード</span><span class="code-value tabular">' + code + "</span></div>";
    card.appendChild(head);

    var grid = el("div", "lobby-grid");
    var qrCol = el("div");
    var qrFrame = el("div", "qr-frame");
    qrCol.appendChild(qrFrame);
    qrCol.appendChild(el("div", "qr-caption", "生徒のスマホのカメラで読み取ってください"));
    grid.appendChild(qrCol);

    var playersCol = el("div", "lobby-players");
    playersCol.appendChild(el("h3", null, "参加した生徒（<span class=\"tabular\" id=\"lobby-count\">0</span>人）"));
    var chipRow = el("div", "chip-row");
    var emptyNote = el("div", "empty-note", "まだ誰も参加していません。コードまたはQRコードを伝えてください。");
    playersCol.appendChild(emptyNote);
    playersCol.appendChild(chipRow);
    grid.appendChild(playersCol);
    card.appendChild(grid);

    var footer = el("div", "lobby-footer");
    var back = el("button", "back-link", "← 教室を閉じてもどる");
    back.addEventListener("click", function () { teardownTeacher(); renderRoleSelect(); });
    var startBtn = el("button", "btn btn-primary btn-lg", "④ クイズをはじめる");
    startBtn.addEventListener("click", function () { startQuiz(); });
    footer.appendChild(back);
    footer.appendChild(startBtn);
    card.appendChild(footer);

    wrap.appendChild(card);
    render(wrap);

    try {
      new QRCode(qrFrame, { text: joinUrlFor(code), width: 190, height: 190, correctLevel: QRCode.CorrectLevel.M });
    } catch (e) { qrFrame.textContent = "QRコードを表示できません"; }

    var countEl = card.querySelector("#lobby-count");

    dbPromise.then(function (db) {
      if (!db) return;
      teacherState.unsubPlayers = db.collection("rooms/" + code + "/players").onSnapshot(function (qs) {
        var byId = {};
        qs.docs.forEach(function (d) { byId[d.id] = d.data(); });
        teacherState.players = byId;
        var ids = Object.keys(byId);
        countEl.textContent = ids.length;
        chipRow.innerHTML = "";
        emptyNote.style.display = ids.length === 0 ? "" : "none";
        ids.sort(function (a, b) { return (byId[a].joinedAt || 0) - (byId[b].joinedAt || 0); });
        ids.forEach(function (id) {
          var chip = el("span", "chip", byId[id].name || "名無し");
          chipRow.appendChild(chip);
        });
      });
    });
  }

  function startQuiz() {
    dbPromise.then(function (db) {
      if (!db) return;
      db.doc("rooms/" + teacherState.code).update({ status: "open", round: 1, updatedAt: Date.now() }).then(function () {
        if (teacherState.unsubPlayers) teacherState.unsubPlayers();
        renderTeacherDash();
      });
    });
  }

  // ---- クイズ進行画面 ----
  function renderTeacherDash() {
    var code = teacherState.code;
    var wrap = el("div", "screen");
    var showResults = false;
    var classComparison = null; // null = not fetched yet; array once loaded
    var bgm = createBgmController();
    teacherState.stopBgm = bgm.stop;

    var top = el("div", "dash-top");
    top.innerHTML =
      '<div class="code-block"><span class="pill">' + (teacherState.className || "未設定") + '</span>' +
      '<span class="code-label">ルームコード</span><span class="code-value tabular">' + code + "</span></div>";
    var actions = el("div", "dash-actions");
    var liveBadge = el("span", "pill live", '<span class="dot"></span> 同期中');
    var closeBtn = el("button", "btn btn-ghost", "しめきる");
    var revealBtn = el("button", "btn btn-ghost", "正解を発表");
    var advanceBtn = el("button", "btn btn-primary", "つぎの問題へ");
    var endBtn = el("button", "back-link", "教室をとじる");
    closeBtn.disabled = true; revealBtn.disabled = true; advanceBtn.disabled = true;

    closeBtn.addEventListener("click", function () { closeRound(); });
    revealBtn.addEventListener("click", function () { revealRound(); });
    advanceBtn.addEventListener("click", function () {
      var room = teacherState.room;
      var total = (room && room.questions || []).length;
      if (room && room.round >= total) {
        bgm.stop();
        showResults = true;
        playCheer();
        renderMain();
        saveClassResultAndLoadComparison();
      } else {
        nextQuestion();
      }
    });
    endBtn.addEventListener("click", function () { teardownTeacher(); renderRoleSelect(); });

    actions.appendChild(liveBadge);
    actions.appendChild(closeBtn);
    actions.appendChild(revealBtn);
    actions.appendChild(advanceBtn);
    actions.appendChild(endBtn);
    top.appendChild(actions);
    wrap.appendChild(top);

    var body = el("div", "dash-body");
    wrap.appendChild(body);
    render(wrap);

    var mainEls = null;

    function buildQuizView() {
      var frag = document.createDocumentFragment();

      var statusRow = el("div", "status-row");
      var roundTitle = el("div", "round-title tabular", "");
      var progressNote = el("div", "progress-note", "");
      statusRow.appendChild(roundTitle);
      statusRow.appendChild(progressNote);
      frag.appendChild(statusRow);

      var questionBanner = el("div", "question-banner");
      var qEyebrow = el("div", "q-eyebrow", "");
      var qBannerText = el("div", "q-text", "");
      questionBanner.appendChild(qEyebrow);
      questionBanner.appendChild(qBannerText);
      frag.appendChild(questionBanner);

      var chartGrid = el("div", "chart-grid");
      var bars = {}, counts = {}, mains = {}, cols = {}, badges = {};
      COLORS.forEach(function (c) {
        var col = el("div", "chart-col");
        col.style.borderColor = "var(" + c.var + ")";
        var countEl = el("div", "chart-count tabular", "0");
        countEl.style.color = "var(" + c.var + ")";
        var track = el("div", "chart-track");
        var bar = el("div", "chart-bar");
        bar.style.background = "var(" + c.var + ")";
        track.appendChild(bar);
        var name = el("div", "chart-name");
        var mainSpan = document.createElement("span");
        mainSpan.textContent = c.jp;
        var jpSpan = el("span", "jp", c.jp);
        name.appendChild(mainSpan);
        name.appendChild(jpSpan);
        col.appendChild(countEl);
        col.appendChild(track);
        col.appendChild(name);
        chartGrid.appendChild(col);
        bars[c.key] = bar; counts[c.key] = countEl; mains[c.key] = mainSpan; cols[c.key] = col;
      });
      frag.appendChild(chartGrid);

      var playersPanel = el("div", "players-panel");
      playersPanel.appendChild(el("h3", null, "参加している生徒"));
      var chipRow = el("div", "chip-row");
      var emptyNote = el("div", "empty-note", "生徒がいません。");
      playersPanel.appendChild(emptyNote);
      playersPanel.appendChild(chipRow);
      frag.appendChild(playersPanel);

      return {
        frag: frag, roundTitle: roundTitle, progressNote: progressNote,
        qEyebrow: qEyebrow, qBannerText: qBannerText,
        bars: bars, counts: counts, mains: mains, cols: cols,
        chipRow: chipRow, emptyNote: emptyNote
      };
    }

    function buildUnitStats() {
      var room = teacherState.room;
      var questions = (room && room.questions) || [];
      var results = (room && room.results) || {};
      var totalPlayers = Object.keys(teacherState.players).length;
      var order = [];
      var byUnit = {};
      questions.forEach(function (q, i) {
        var unit = q.unit || "単元未設定";
        if (!byUnit[unit]) { byUnit[unit] = { correct: 0, questionCount: 0 }; order.push(unit); }
        var r = results[i + 1];
        byUnit[unit].correct += r ? (r.correct || 0) : 0;
        byUnit[unit].questionCount += 1;
      });
      return order.map(function (unit) {
        var s = byUnit[unit];
        var possible = s.questionCount * totalPlayers;
        var rate = possible > 0 ? Math.round((s.correct / possible) * 100) : null;
        return { unit: unit, correct: s.correct, possible: possible, questionCount: s.questionCount, rate: rate };
      });
    }

    function buildClassSummary() {
      var room = teacherState.room;
      var questions = (room && room.questions) || [];
      var results = (room && room.results) || {};
      var totalPlayers = Object.keys(teacherState.players).length;
      var totalCorrect = 0;
      questions.forEach(function (q, i) {
        var r = results[i + 1];
        totalCorrect += r ? (r.correct || 0) : 0;
      });
      var possible = questions.length * totalPlayers;
      var rate = possible > 0 ? Math.round((totalCorrect / possible) * 100) : null;
      return { totalCorrect: totalCorrect, possible: possible, rate: rate, totalPlayers: totalPlayers, questionCount: questions.length };
    }

    function saveClassResultAndLoadComparison() {
      var room = teacherState.room;
      if (!room) return;
      var key = contentKeyFor(room.questions || []);
      var summary = buildClassSummary();
      if (summary.questionCount === 0 || summary.totalPlayers === 0) {
        classComparison = [];
        if (showResults) renderMain();
        return;
      }
      dbPromise.then(function (db) {
        if (!db) { classComparison = []; if (showResults) renderMain(); return; }
        var record = {
          className: teacherState.className || "未設定",
          contentKey: key,
          totalCorrect: summary.totalCorrect,
          possible: summary.possible,
          rate: summary.rate,
          questionCount: summary.questionCount,
          totalPlayers: summary.totalPlayers,
          completedAt: Date.now()
        };
        db.doc("classResults/" + code).set(record).then(function () {
          return db.collection("classResults").where("contentKey", "==", key).get();
        }).then(function (qs) {
          var list = qs.docs.map(function (d) { return d.data(); }).filter(Boolean);
          list.sort(function (a, b) { return (a.completedAt || 0) - (b.completedAt || 0); });
          classComparison = list;
          if (showResults) renderMain();
        }).catch(function () {
          classComparison = [];
          if (showResults) renderMain();
        });
      });
    }

    function buildResultsView() {
      var frag = document.createDocumentFragment();

      var summary = buildClassSummary();
      var summaryPanel = el("div", "leaderboard class-summary");
      summaryPanel.appendChild(el("h2", "display", "🎯 " + (teacherState.className || "未設定") + " 全体の成績"));
      if (summary.totalPlayers === 0 || summary.questionCount === 0) {
        summaryPanel.appendChild(el("div", "empty-note", summary.questionCount === 0 ? "問題が登録されていません。" : "参加した生徒がいないため集計できません。"));
      } else {
        var tiles = el("div", "summary-tiles");
        var rateTile = el("div", "summary-tile");
        rateTile.appendChild(el("div", "summary-tile-value tabular", (summary.rate === null ? "—" : summary.rate) + "%"));
        rateTile.appendChild(el("div", "summary-tile-label", "クラス全体の正答率"));
        var countTile = el("div", "summary-tile");
        countTile.appendChild(el("div", "summary-tile-value tabular", summary.totalCorrect + " 問"));
        countTile.appendChild(el("div", "summary-tile-label", "正解した合計数"));
        tiles.appendChild(rateTile);
        tiles.appendChild(countTile);
        summaryPanel.appendChild(tiles);
        summaryPanel.appendChild(el("div", "unit-row-sub tabular",
          "全 " + summary.questionCount + " 問 × 参加 " + summary.totalPlayers + " 人 中、のべ " + summary.totalCorrect + " 件正解"));
      }
      frag.appendChild(summaryPanel);

      var comparePanel = el("div", "leaderboard class-compare");
      comparePanel.appendChild(el("h2", "display", "🏫 他クラスとの比較"));
      if (classComparison === null) {
        comparePanel.appendChild(el("div", "empty-note", "読み込み中…"));
      } else if (classComparison.length === 0) {
        comparePanel.appendChild(el("div", "empty-note", "比較できる他クラスのデータはまだありません。"));
      } else {
        var compareHead = el("div", "compare-row compare-head");
        compareHead.appendChild(el("div", "compare-name", "クラス"));
        compareHead.appendChild(el("div", "compare-rate tabular", "正答率"));
        compareHead.appendChild(el("div", "compare-count tabular", "正解数"));
        comparePanel.appendChild(compareHead);
        classComparison.forEach(function (c) {
          var row = el("div", "compare-row");
          if (c.className === (teacherState.className || "未設定")) row.classList.add("is-self");
          row.appendChild(el("div", "compare-name", c.className || "未設定"));
          row.appendChild(el("div", "compare-rate tabular", (c.rate === null || c.rate === undefined ? "—" : c.rate) + "%"));
          row.appendChild(el("div", "compare-count tabular", (c.totalCorrect || 0) + " / " + (c.possible || 0)));
          comparePanel.appendChild(row);
        });
      }
      frag.appendChild(comparePanel);

      var unitPanel = el("div", "leaderboard unit-panel");
      unitPanel.appendChild(el("h2", "display", "📚 単元別の正答状況"));
      var unitStats = buildUnitStats();
      var totalPlayers = Object.keys(teacherState.players).length;
      if (totalPlayers === 0) {
        unitPanel.appendChild(el("div", "empty-note", "参加した生徒がいないため集計できません。"));
      } else if (unitStats.length === 0) {
        unitPanel.appendChild(el("div", "empty-note", "問題が登録されていません。"));
      } else {
        unitStats.forEach(function (s) {
          var row = el("div", "unit-row");
          var head = el("div", "unit-row-head");
          head.appendChild(el("span", "unit-row-name", s.unit));
          head.appendChild(el("span", "unit-row-rate tabular", s.rate === null ? "—" : s.rate + "%"));
          row.appendChild(head);
          var bar = el("div", "unit-bar");
          var fill = el("div", "unit-bar-fill");
          fill.style.width = (s.rate || 0) + "%";
          bar.appendChild(fill);
          row.appendChild(bar);
          row.appendChild(el("div", "unit-row-sub tabular",
            "正答 " + s.correct + " / " + s.possible + "（" + s.questionCount + "問 × 参加" + totalPlayers + "人）"));
          unitPanel.appendChild(row);
        });
      }
      frag.appendChild(unitPanel);

      var panel = el("div", "leaderboard");
      panel.appendChild(el("h2", "display", "🏆 結果発表（" + (teacherState.className || "未設定") + "）"));
      var ids = Object.keys(teacherState.players);
      ids.sort(function (a, b) {
        return ((teacherState.players[b].score || 0) - (teacherState.players[a].score || 0));
      });
      if (ids.length === 0) {
        panel.appendChild(el("div", "empty-note", "参加した生徒がいません。"));
      } else {
        ids.forEach(function (id, idx) {
          var p = teacherState.players[id];
          var row = el("div", "lb-row");
          row.appendChild(el("div", "lb-rank", String(idx + 1)));
          row.appendChild(el("div", "lb-name", p.name || "名無し"));
          row.appendChild(el("div", "lb-score tabular", (p.score || 0) + " 問正解"));
          panel.appendChild(row);
        });
      }
      var back = el("button", "back-link lb-back", "← 問題の画面にもどる");
      back.addEventListener("click", function () { showResults = false; renderMain(); });
      panel.appendChild(back);
      frag.appendChild(panel);
      return { frag: frag };
    }

    function renderMain() {
      body.innerHTML = "";
      if (showResults) {
        mainEls = buildResultsView();
        body.appendChild(mainEls.frag);
      } else {
        mainEls = buildQuizView();
        body.appendChild(mainEls.frag);
        applyRoomState(teacherState.room);
        renderCounts();
        renderPlayers();
      }
    }

    function applyRoomState(room) {
      if (!room || showResults) return;
      var status = room.status, round = room.round || 0;
      var questions = room.questions || [];
      var total = questions.length;
      var currentQ = round > 0 ? questions[round - 1] : null;
      var hasMore = round < total;

      if (status === "open") { bgm.ensureForRound(round); stopRevealSfx(); } else { bgm.stop(); }

      closeBtn.disabled = (status !== "open");
      revealBtn.disabled = (status !== "closed");
      advanceBtn.disabled = (status !== "revealed");
      advanceBtn.textContent = hasMore ? "つぎの問題へ" : "🏆 結果を見る";

      mainEls.roundTitle.textContent = "第 " + round + " / " + total + " 問 — " +
        (status === "open" ? "受付中" : status === "closed" ? "しめきり" : "正解発表ずみ");
      mainEls.qEyebrow.textContent = "第 " + round + " 問" + (currentQ && currentQ.unit ? "　単元：" + currentQ.unit : "");
      mainEls.qBannerText.textContent = currentQ ? currentQ.text : "";

      COLORS.forEach(function (c) {
        mainEls.mains[c.key].textContent = questionLabel(currentQ, c.key);
        var col = mainEls.cols[c.key];
        col.classList.remove("is-correct", "is-wrong");
        var oldBadge = col.querySelector(".chart-badge");
        if (oldBadge) oldBadge.remove();
        if (status === "revealed" && currentQ) {
          var isCorrect = currentQ.correct === c.key;
          col.classList.add(isCorrect ? "is-correct" : "is-wrong");
          var badge = el("div", "chart-badge " + (isCorrect ? "ok" : "no"), isCorrect ? "✓" : "×");
          col.appendChild(badge);
        }
      });
    }

    function renderCounts() {
      if (showResults || !mainEls || !mainEls.bars) return;
      var total = 0, maxCount = 1;
      COLORS.forEach(function (c) { total += teacherState.votesByColor[c.key].length; });
      COLORS.forEach(function (c) { maxCount = Math.max(maxCount, teacherState.votesByColor[c.key].length); });
      COLORS.forEach(function (c) {
        var n = teacherState.votesByColor[c.key].length;
        mainEls.counts[c.key].textContent = n;
        var pct = total === 0 ? 0 : Math.round((n / maxCount) * 100);
        mainEls.bars[c.key].style.height = (n === 0 ? 4 : Math.max(pct, 6)) + "%";
      });
      var playerCount = Object.keys(teacherState.players).length;
      mainEls.progressNote.textContent = playerCount === 0 ? "" : total + " / " + playerCount + " 人が回答";
    }

    function renderPlayers() {
      if (showResults || !mainEls || !mainEls.chipRow) return;
      var ids = Object.keys(teacherState.players);
      mainEls.chipRow.innerHTML = "";
      if (ids.length === 0) { mainEls.emptyNote.style.display = ""; return; }
      mainEls.emptyNote.style.display = "none";
      var votedIds = {};
      COLORS.forEach(function (c) {
        teacherState.votesByColor[c.key].forEach(function (v) { votedIds[v.id] = c; });
      });
      ids.sort(function (a, b) { return (teacherState.players[a].joinedAt || 0) - (teacherState.players[b].joinedAt || 0); });
      ids.forEach(function (id) {
        var p = teacherState.players[id];
        var chip = el("span", "chip");
        var voted = votedIds[id];
        if (voted) chip.classList.add("answered");
        var mark = el("span", "mark");
        mark.style.background = voted ? "var(" + voted.var + ")" : "var(--line)";
        chip.appendChild(mark);
        chip.appendChild(document.createTextNode((p.name || "名無し") + (p.score ? "・" + p.score + "問" : "")));
        mainEls.chipRow.appendChild(chip);
      });
    }

    function subscribeRoundVotes(round) {
      if (teacherState.unsubRoundVotes) { teacherState.unsubRoundVotes(); teacherState.unsubRoundVotes = null; }
      teacherState.votesByColor = { red: [], blue: [], yellow: [], green: [] };
      teacherState.subscribedRound = round;
      dbPromise.then(function (db) {
        if (!db || teacherState.subscribedRound !== round) return;
        teacherState.unsubRoundVotes = db.collection("rooms/" + code + "/rounds/" + round + "/votes").onSnapshot(function (qs) {
          var by = { red: [], blue: [], yellow: [], green: [] };
          qs.docs.forEach(function (d) {
            var v = d.data();
            if (by[v.color]) by[v.color].push({ id: d.id, color: v.color });
          });
          teacherState.votesByColor = by;
          renderCounts();
          renderPlayers();
        });
      });
    }

    renderMain();

    dbPromise.then(function (db) {
      if (!db) return;
      teacherState.unsubRoom = db.doc("rooms/" + code).onSnapshot(function (snap) {
        var data = snap.data();
        teacherState.room = data;
        if (!data) return;
        if (data.round !== teacherState.subscribedRound) subscribeRoundVotes(data.round);
        if (!showResults) applyRoomState(data);
      });

      teacherState.unsubPlayers = db.collection("rooms/" + code + "/players").onSnapshot(function (qs) {
        var byId = {};
        qs.docs.forEach(function (d) { byId[d.id] = d.data(); });
        teacherState.players = byId;
        renderPlayers();
        if (showResults) renderMain();
      });
    });
  }

  function closeRound() {
    dbPromise.then(function (db) {
      if (!db) return;
      db.doc("rooms/" + teacherState.code).update({ status: "closed", updatedAt: Date.now() });
    });
  }

  function revealRound() {
    dbPromise.then(function (db) {
      if (!db || !teacherState.room) return;
      var code = teacherState.code;
      var round = teacherState.room.round;
      var question = (teacherState.room.questions || [])[round - 1];
      db.doc("rooms/" + code).update({ status: "revealed", updatedAt: Date.now() });
      if (!question) return;
      db.collection("rooms/" + code + "/rounds/" + round + "/votes").get().then(function (qs) {
        var correctCount = 0;
        qs.docs.forEach(function (d) {
          var v = d.data();
          if (v.color === question.correct) {
            correctCount++;
            var sid = d.id;
            var cur = (teacherState.players[sid] && teacherState.players[sid].score) || 0;
            db.doc("rooms/" + code + "/players/" + sid).update({ score: cur + 1 }).catch(function () {});
          }
        });
        var resultsUpdate = {};
        resultsUpdate["results." + round] = { correct: correctCount, answered: qs.docs.length };
        db.doc("rooms/" + code).update(resultsUpdate).catch(function () {});

        var answered = qs.docs.length;
        if (answered > 0) {
          var correctRate = correctCount / answered;
          if (1 - correctRate >= 0.5) { playBoo(); } else if (correctRate >= 0.5) { playClap(); }
        }
      });
    });
  }

  function nextQuestion() {
    dbPromise.then(function (db) {
      if (!db || !teacherState.room) return;
      var total = (teacherState.room.questions || []).length;
      var nextRoundNum = (teacherState.room.round || 0) + 1;
      if (nextRoundNum > total) return;
      db.doc("rooms/" + teacherState.code).update({ status: "open", round: nextRoundNum, updatedAt: Date.now() });
    });
  }

  function teardownTeacher() {
    if (teacherState.unsubRoom) teacherState.unsubRoom();
    if (teacherState.unsubRoundVotes) teacherState.unsubRoundVotes();
    if (teacherState.unsubPlayers) teacherState.unsubPlayers();
    if (teacherState.stopBgm) teacherState.stopBgm();
    teacherState = {
      code: null, unsubRoom: null, unsubRoundVotes: null, unsubPlayers: null, room: null,
      subscribedRound: -1, votesByColor: { red: [], blue: [], yellow: [], green: [] }, players: {}, prepQuestions: [],
      className: null, stopBgm: null
    };
  }

  // ================= STUDENT =================
  var studentState = {
    code: null, sid: null, name: null,
    unsubRoom: null, unsubVote: null, unsubMe: null,
    room: null, myVote: null, myScore: 0,
    subscribedRound: -1
  };

  function goStudentJoin() {
    renderJoinForm(null);
  }

  function renderJoinForm(prefilledCode) {
    var quick = !!prefilledCode;
    var wrap = el("div", "screen card-screen join-screen");
    var card = el("div", "basic-card");
    card.innerHTML = quick
      ? '<h2 class="display">教室に参加する</h2><p class="sub">QRコードを読み取りました。お名前を入力して参加してください。</p>'
      : '<h2 class="display">教室に参加する</h2><p class="sub">先生から伝えられた4桁のコードと、あなたの名前を入力してください。</p>';
    var stack = el("div", "field-stack");

    var nameLabel = el("label", "field-label", "なまえ（必須）");
    var nameInput = el("input", "field");
    nameInput.placeholder = "たろう";
    nameInput.maxLength = 12;
    nameInput.value = readLS("cb_last_name", "");

    var l1 = el("div"); l1.appendChild(nameLabel); l1.appendChild(nameInput);
    stack.appendChild(l1);

    var codeInput = null;
    if (!quick) {
      var codeLabel = el("label", "field-label", "ルームコード");
      codeInput = el("input", "field tabular");
      codeInput.placeholder = "0000";
      codeInput.inputMode = "numeric";
      codeInput.maxLength = 4;
      codeInput.value = readLS("cb_last_room", "");
      var l2 = el("div"); l2.appendChild(codeLabel); l2.appendChild(codeInput);
      stack.appendChild(l2);
    } else {
      stack.appendChild(el("div", "pill live", '<span class="dot"></span> ルームコード ' + prefilledCode));
    }

    var errNote = el("div", "error-note", "");
    var joinBtn = el("button", "btn btn-primary btn-lg", "参加する");

    joinBtn.addEventListener("click", function () {
      var name = nameInput.value.trim();
      if (!name) { errNote.textContent = "なまえを入力してください。"; nameInput.focus(); return; }
      var code = quick ? prefilledCode : (codeInput.value.trim());
      if (!/^[0-9]{4}$/.test(code)) { errNote.textContent = "4桁のコードを入力してください。"; return; }
      errNote.textContent = "";
      joinBtn.disabled = true;
      joinBtn.textContent = "参加中…";
      joinRoom(code, name, function (err) {
        if (err) {
          joinBtn.disabled = false;
          joinBtn.textContent = "参加する";
          errNote.textContent = err === "not-found"
            ? "そのコードの教室が見つかりません。コードを確認してください。"
            : "参加できませんでした。もう一度お試しください。";
        }
      });
    });

    stack.appendChild(errNote);
    stack.appendChild(joinBtn);
    card.appendChild(stack);

    if (!quick) {
      var back = el("button", "back-link", "← もどる");
      back.addEventListener("click", renderRoleSelect);
      card.appendChild(el("div", "divider", "or"));
      card.appendChild(back);
    }

    wrap.appendChild(card);
    render(wrap);
  }

  function joinRoom(code, name, cb) {
    dbPromise.then(function (db) {
      if (!db) { cb && cb("write-failed"); toast("この画面ではリアルタイム機能が使えません。"); return; }
      db.doc("rooms/" + code).get().then(function (snap) {
        if (!snap.exists) { cb && cb("not-found"); return; }
        var sid = studentId();
        writeLS("cb_last_room", code);
        writeLS("cb_last_name", name);
        db.doc("rooms/" + code + "/players/" + sid).set({ name: name, joinedAt: Date.now(), score: 0 }).then(function () {
          studentState.code = code;
          studentState.sid = sid;
          studentState.name = name;
          cb && cb(null);
          renderStudentSession();
        }).catch(function () { cb && cb("write-failed"); });
      }).catch(function () { cb && cb("write-failed"); });
    });
  }

  // ---- 参加後の生徒画面（待機 / 回答 / 正解発表 をまとめて管理） ----
  function renderStudentSession() {
    var code = studentState.code, sid = studentState.sid;
    var wrap = el("div", "screen");

    var top = el("div", "play-top");
    top.innerHTML =
      '<span class="pill live"><span class="dot"></span> ' + code + '</span>' +
      '<span class="who">参加中: <strong>' + studentState.name + "</strong></span>";
    var topRight = el("div", "top-right");
    var scorePill = el("span", "pill score", "せいかい 0問");
    topRight.appendChild(scorePill);
    top.appendChild(topRight);
    wrap.appendChild(top);

    var body = el("div", "play-body");
    wrap.appendChild(body);
    render(wrap);

    function renderBody() {
      body.innerHTML = "";
      var room = studentState.room;
      var status = room ? room.status : "lobby";

      if (!room || status === "lobby") {
        var waitCard = el("div", "basic-card", "");
        waitCard.style.maxWidth = "360px";
        waitCard.style.textAlign = "center";
        waitCard.appendChild(el("div", "display", "🙋"));
        waitCard.appendChild(el("h2", null, "参加しました！"));
        waitCard.appendChild(el("p", "sub", "先生がクイズを始めるのをお待ちください。"));
        body.appendChild(waitCard);
        return;
      }

      var questions = room.questions || [];
      var round = room.round || 0;
      var currentQ = round > 0 ? questions[round - 1] : null;
      var vote = studentState.myVote;
      var votedThisRound = vote && vote.round === round;

      if (status === "revealed" && currentQ) {
        var isCorrect = votedThisRound && vote.color === currentQ.correct;
        var wasAnswered = !!votedThisRound;
        var panel = el("div", "result-panel " + (wasAnswered ? (isCorrect ? "ok" : "no") : "no"));
        panel.appendChild(el("div", "rp-icon", wasAnswered ? (isCorrect ? "⭕" : "❌") : "➖"));
        panel.appendChild(el("div", "rp-title", wasAnswered ? (isCorrect ? "せいかい！" : "ざんねん…") : "回答なし"));
        var correctLabel = questionLabel(currentQ, currentQ.correct);
        panel.appendChild(el("div", "rp-sub", "正解は「" + correctLabel + "」でした"));
        body.appendChild(panel);

        var grid = el("div", "buzz-grid");
        COLORS.forEach(function (c) {
          var b = el("button", "buzz-btn b-" + c.key);
          b.disabled = true;
          var isRight = currentQ.correct === c.key;
          var isMine = votedThisRound && vote.color === c.key;
          if (!isRight && !isMine) b.classList.add("dim");
          if (isRight) b.appendChild(el("div", "badge", "✓"));
          else if (isMine) b.appendChild(el("div", "badge", "×"));
          grid.appendChild(b);
        });
        body.appendChild(grid);
        return;
      }

      var statusText = el("div", "play-status" + (status === "open" && !votedThisRound ? " open" : ""));
      if (status === "open" && !votedThisRound) statusText.textContent = "いますぐ色をタップ！";
      else if (status === "open" && votedThisRound) statusText.textContent = "回答しました。しめきりを待っています…";
      else if (status === "closed") statusText.textContent = "しめきりました。正解発表をお待ちください。";
      else statusText.textContent = "つぎの問題を待っています…";
      body.appendChild(statusText);

      var grid2 = el("div", "buzz-grid");
      COLORS.forEach(function (c) {
        var b = el("button", "buzz-btn b-" + c.key);
        b.classList.toggle("chosen", !!(votedThisRound && vote.color === c.key));
        b.disabled = !(status === "open" && !votedThisRound);
        b.addEventListener("click", function () { submitVote(c.key); });
        grid2.appendChild(b);
      });
      body.appendChild(grid2);
    }

    function submitVote(colorKey) {
      var room = studentState.room;
      if (!room || room.status !== "open") return;
      playColorSound(colorKey);
      var round = room.round;
      var payload = { round: round, color: colorKey, ts: Date.now() };
      studentState.myVote = payload;
      renderBody();
      dbPromise.then(function (db) {
        if (!db) return;
        db.doc("rooms/" + code + "/rounds/" + round + "/votes/" + sid).set(payload).catch(function () {
          toast("送信に失敗しました。もう一度お試しください。");
        });
      });
    }

    function subscribeMyVote(round) {
      if (studentState.unsubVote) { studentState.unsubVote(); studentState.unsubVote = null; }
      studentState.myVote = null;
      studentState.subscribedRound = round;
      dbPromise.then(function (db) {
        if (!db || studentState.subscribedRound !== round) return;
        studentState.unsubVote = db.doc("rooms/" + code + "/rounds/" + round + "/votes/" + sid).onSnapshot(function (snap) {
          studentState.myVote = snap.exists ? snap.data() : null;
          renderBody();
        });
      });
    }

    dbPromise.then(function (db) {
      if (!db) return;
      var prevRound = -1;
      var firstSnapshot = true;
      var prevStatus = null;
      studentState.unsubRoom = db.doc("rooms/" + code).onSnapshot(function (snap) {
        var data = snap.data();
        if (!data) return;
        var justOpened = !firstSnapshot && data.status === "open" && (data.round !== prevRound || prevStatus !== "open");
        var justRevealed = !firstSnapshot && data.status === "revealed" && prevStatus !== "revealed";
        studentState.room = data;
        if (data.round !== studentState.subscribedRound) subscribeMyVote(data.round);
        if (justOpened) playChime();
        if (justRevealed) {
          var q = (data.questions || [])[data.round - 1];
          var v = studentState.myVote;
          if (q && v && v.round === data.round && v.color === q.correct) playCheer();
          else if (q) playWrongSound();
        }
        prevRound = data.round;
        prevStatus = data.status;
        firstSnapshot = false;
        renderBody();
      });
      studentState.unsubMe = db.doc("rooms/" + code + "/players/" + sid).onSnapshot(function (snap) {
        var d = snap.data();
        studentState.myScore = (d && d.score) || 0;
        scorePill.textContent = "せいかい " + studentState.myScore + "問";
      });
    });
  }

  // ================= boot =================
  (function boot() {
    var params = new URLSearchParams(location.search);
    var code = (params.get("code") || "").trim();
    var role = params.get("role");
    if (role === "student" && /^[0-9]{4}$/.test(code)) {
      renderJoinForm(code);
    } else {
      renderRoleSelect();
    }
  })();
})();
</script>
</body>
</html>
